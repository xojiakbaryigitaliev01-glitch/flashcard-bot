services:
  - type: web
    name: flashcard-bot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --no-frozen-lockfile &&
      BASE_PATH=/ PORT=3000 NODE_ENV=production pnpm --filter @workspace/flashcard-app run build
    startCommand: NODE_ENV=production PORT=$PORT pnpm --filter @workspace/api-server run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false

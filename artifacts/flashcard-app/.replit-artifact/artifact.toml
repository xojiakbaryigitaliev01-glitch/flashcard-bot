kind = "web"
previewPath = "/"
title = "Flashcard Mini App"
version = "1.0.0"
id = "artifacts/flashcard-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20688

[services.development]
run = "pnpm --filter @workspace/flashcard-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flashcard-app", "run", "build" ]
publicDir = "artifacts/flashcard-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20688"
BASE_PATH = "/"
